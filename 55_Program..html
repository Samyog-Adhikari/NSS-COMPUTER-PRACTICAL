 <html>
<head>
    <title>HTML Heading Tags</title>
</head>

<body>

    <h1 style="font-family: Arial; font-size: 36px; color: blue;">
        This is Heading 1
    </h1>

    <h2 style="font-family: Arial; font-size: 30px; color: green;">
        This is Heading 2
    </h2>

    <h3 style="font-family: Georgia; font-size: 26px; color: red;">
        This is Heading 3
    </h3>

    <h4 style="font-family: Verdana; font-size: 22px; color: purple;">
        This is Heading 4
    </h4>

    <h5 style="font-family: Times New Roman; font-size: 18px; color: orange;">
        This is Heading 5
    </h5>

    <h6 style="font-family: Courier New; font-size: 16px; color: brown;">
        This is Heading 6
    </h6>

</body>
</html>
