  <body>
    <h1>Embedding Audio and Video in HTML</h1>
    <h2>Audio Example</h2>
    <audio controls>
      <source src="audio_example.mp3" type="audio/mpeg" />

    </audio>
    <h2>Video Example</h2>

      Your browser does not support the video element.
    </video>
  </body>
